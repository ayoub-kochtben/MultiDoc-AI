[project]
name = "multidoc-ai-backend"
version = "1.0.0"
description = "MultiDoc AI - local RAG backend (FastAPI)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgserver>=0.1.4",
    "pgvector>=0.3",
    "httpx>=0.27",
    "docling>=2.15",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "lxml>=5.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "sentence-transformers>=3.0",
    "charset-normalizer>=3.3",
    "filetype>=1.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "reportlab>=4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider -m \"not integration\""
markers = [
    "integration: needs PostgreSQL + Ollama running",
]
